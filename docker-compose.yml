services:
  db:
    image: postgres:16-alpine
    container_name: iknow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iknow}
      POSTGRES_USER: ${POSTGRES_USER:-iknow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iknow_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iknow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iknow} -d ${POSTGRES_DB:-iknow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iknow_postgres_data:
